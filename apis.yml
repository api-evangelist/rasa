aid: rasa
name: Rasa
description: >-
  Rasa is an open-core conversational AI framework for enterprises, built by Rasa
  Technologies GmbH, that natively leverages generative AI through CALM
  (Conversational AI with Language Models) to build reliable text and voice
  assistants. Rasa Pro is the pro-code framework (with Flows, custom actions,
  channel connectors, multi-LLM routing, observability and Kubernetes
  deployment); Rasa Studio is the companion no-code UI; and Rasa Open Source
  provides the underlying NLU and dialogue-management framework. The self-hosted
  runtime exposes an HTTP API for managing conversation trackers and training,
  testing and loading models, plus a Python SDK action server for custom actions.
